<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jelajahi contoh koleksi Standing Flower Zahraflorist untuk wedding, duka cita, dan ucapan sukses. Cari dan pilih rangkaian berdiri sesuai kebutuhan.">
  <meta name="robots" content="noindex, nofollow">
  <title>Standing Flower — Zahraflorist</title>
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <script type="module" src="assets/js/catalog.js"></script>
</head>
<body data-page="standing-flower" data-type="standing-flower" class="bg-[#FAF7F2] font-sans text-[#26372D] antialiased">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:bg-white focus:p-4">Lewati ke konten utama</a>
  <header id="site-header"></header>
  <main id="main-content" tabindex="-1" class="mx-auto max-w-[1200px] px-5 py-10 md:px-8 md:py-16">
    <nav aria-label="Breadcrumb" class="text-sm"><ol class="flex flex-wrap gap-2"><li><a href="index.html" class="hover:underline">Beranda</a></li><li aria-hidden="true">/</li><li aria-current="page">Standing Flower</li></ol></nav>
    <header class="py-10 md:py-14"><p class="text-sm uppercase tracking-[0.2em]">Koleksi Zahraflorist</p><h1 id="catalog-title" class="mt-4 font-serif text-4xl md:text-6xl">Standing Flower</h1><p id="catalog-intro" class="mt-5 max-w-2xl leading-relaxed">Rangkaian berdiri yang elegan untuk menyambut dan menyampaikan perhatian.</p></header>
    <p class="mb-8 border-y border-[#26372D]/15 py-4 text-sm leading-relaxed">Koleksi dan harga contoh presentasi. Gambar standing flower berupa ilustrasi placeholder, bukan foto produk asli.</p>
    <section aria-label="Pencarian dan filter koleksi" class="space-y-6">
      <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
        <form id="catalog-search" role="search" class="w-full md:max-w-md"><label for="catalog-query" class="mb-2 block">Cari nama produk</label><div class="flex gap-2"><input id="catalog-query" name="q" type="search" placeholder="Nama rangkaian…" class="min-h-11 min-w-0 flex-1 rounded border border-[#26372D]/25 bg-white px-4 py-3"><button type="submit" class="min-h-11 rounded bg-[#315746] px-5 py-3 text-white">Cari</button></div></form>
        <div><label for="catalog-sort" class="mb-2 block">Urutkan produk</label><select id="catalog-sort" class="min-h-11 w-full rounded border border-[#26372D]/25 bg-white px-4 py-3"><option value="pilihan">Pilihan Toko</option><option value="harga-terendah">Harga Terendah</option><option value="harga-tertinggi">Harga Tertinggi</option></select></div>
      </div>
      <nav id="catalog-filters" aria-label="Kategori produk" class="flex flex-wrap gap-2"></nav>
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-[#26372D]/15 pb-5"><p id="catalog-count" role="status" aria-live="polite"></p><button id="catalog-reset" type="button" class="min-h-11 px-2 py-3 underline underline-offset-4">Atur Ulang Filter</button></div>
    </section>
    <div id="product-grid" class="mt-8 grid grid-cols-2 gap-x-5 gap-y-10 lg:grid-cols-4"></div>
    <nav id="pagination" aria-label="Halaman produk" class="mt-12 flex flex-wrap justify-center gap-2"></nav>
    <noscript><p class="py-8">Aktifkan JavaScript untuk menampilkan dan menyaring koleksi produk.</p></noscript>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
